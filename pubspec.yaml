name: betteriptv
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  auto_route: ^9.2.2
  auto_size_text: ^3.0.0
  collection: ^1.18.0
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_secure_storage: ^9.2.2
  get_it: 8.0.0
  go_router: ^14.3.0
  http: ^1.2.2
  json_annotation: ^4.9.0
  m3u:
    git:
      url: https://github.com/bmoliveira/m3u-parse-utils
      ref: master
  media_kit: ^1.1.11
  media_kit_libs_video: ^1.0.5
  media_kit_video: ^1.2.5
  talker: ^4.4.1
  talker_flutter: ^4.4.1

dev_dependencies:
  better_linter:
    git:
      url: https://github.com/mdikcinar/better_linter.git
      ref: master
  build_runner: ^2.4.13
  flutter_test:
    sdk: flutter
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/

  fonts:
    - family: Ubuntu
      fonts:
        - asset: assets/Ubuntu-Light.ttf

msix_config:
  display_name: Better IPTV Player
  publisher_display_name: Betterlifewithapps
  identity_name: 13356Betterlifewithapps.BetterIPTVplayer
  msix_version: 1.0.0.0
  logo_path: assets\app_icon.png
  capabilities: internetClient
  publisher: CN=9238C68C-3C4A-4820-A5BF-4587B80F4D5D
